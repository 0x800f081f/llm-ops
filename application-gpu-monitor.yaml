apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-monitor
  namespace: argocd
  labels:
    app.kubernetes.io/name: gpu-monitor
    app.kubernetes.io/component: gpu
    app.kubernetes.io/managed-by: argocd
    app.kubernetes.io/part-of: llm-platform
spec:
  project: default
  source:
    repoURL: https://github.com/NVIDIA/dcgm-exporter
    targetRevision: "4.8.4"
    path: deployment
    helm:
      releaseName: dcgm-exporter
      values: |
        serviceMonitor:
          additionalLabels:
            release: monitoring
        kubernetes:
          enablePodLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
