ingressRoute:
  dashboard:
    enabled: true
    entryPoints:
      - web
providers:
  kubernetesGateway:
    enabled: true
gateway:
  listeners:
    web:
      port: 80
      protocol: HTTP
    websecure:
      port: 443
      protocol: HTTPS
service:
  type: NodePort
ports:
  web:
    port: 80
    nodePort: 30080
  websecure:
    port: 443
    nodePort: 30443